<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      No webfont. The type stack resolves to SF Pro through -apple-system, which is the real system
      face rendered with the system's own optical sizing and hinting rather than a webfont
      approximation of it. It also removes a third-party request from the critical path and the
      flash of fallback text that came with it.
    -->
    <meta name="color-scheme" content="light dark" />
    <!-- Lets the browser tint its own chrome to match the page, as Safari does on iOS. -->
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Transform raw company financials into structured financial analysis, trends, ratios, and actionable insights." />
    <title>Financial Company Analyzer</title>
    <script>
      // Apply the stored theme before first paint so the page never flashes the wrong mode.
      (function () {
        try {
          var stored = localStorage.getItem('fca.theme');
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* storage unavailable; fall back to light */ }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
